project(':cti-java:cti-driver-ctip') {
    // The TLS backport uses ByteBuffer: source/target alone links JDK 9 covariant
    // methods and fails on Java 8. Restrict this backport module to the Java 8 API.
    tasks.withType(JavaCompile).configureEach { options.release = 8 }
    sourceSets {
        tlsTest {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    configurations.tlsTestImplementation.extendsFrom(configurations.implementation)
    configurations.tlsTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
    dependencies {
        api project(':cti-java:cti-if')
        tlsTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        tlsTestRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
        tlsTestImplementation project(':cti-java:cti-server-ctip')
        tlsTestImplementation project(':cti-java:cti-driver-rest')
        tlsTestImplementation project(':homare')
    }
    tasks.register('tlsTest', Test) {
        group = 'verification'
        description = 'Stage 1 local TLS, lifecycle, protocol and distribution regressions'
        testClassesDirs = sourceSets.tlsTest.output.classesDirs
        classpath = sourceSets.tlsTest.runtimeClasspath
        useJUnitPlatform()
        // Separate JVMs isolate TLS system properties; each fork runs cases sequentially.
        maxParallelForks = 2
        systemProperty 'tls.test.classpath', sourceSets.tlsTest.runtimeClasspath.asPath
        systemProperty 'stage1.root', rootProject.projectDir.absolutePath
        dependsOn ':cti-java:releaseDriverJar', ':cti-java:releaseDriverMinJar', ':homare:jar'
        doFirst {
            systemProperty 'stage1.product.classpath', files(project(':homare').tasks.named('jar').get().archiveFile, project(':homare').configurations.runtimeClasspath).asPath
        }
        if (System.getProperty('stage1.java8') != null) {
            systemProperty 'stage1.java8', System.getProperty('stage1.java8')
        }
        ['cti.integration.uri', 'cti.integration.user', 'cti.integration.password'].each { name ->
            if (System.getProperty(name) != null) { systemProperty name, System.getProperty(name) }
        }
        afterSuite { descriptor, result ->
            if (!descriptor.parent && (result.skippedTestCount != 0 || result.testCount == 0)) {
                throw new GradleException('Required TLS tests must run without skips')
            }
        }
        testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat = 'full' }
    }
}

