project(':cti-java') {
    def releaseDir = layout.buildDirectory.dir('release')
    def archiveStem = "cti-java-${project.version.toString().replace('.', '_')}"

    def ctiDriverFatJar = project(':cti-java:cti-driver').tasks.named('fatJar', Jar)
    def ctiDriverRestJar = project(':cti-java:cti-driver-rest').tasks.named('jar', Jar)
    def ctiDriverCtipJar = project(':cti-java:cti-driver-ctip').tasks.named('jar', Jar)
    def ctiIfJar = project(':cti-java:cti-if').tasks.named('jar', Jar)
    def zsPluginJar = project(':cti-java:zs-plugin').tasks.named('jar', Jar)
    def zsResolverJar = project(':sakae:zs-resolver').tasks.named('jar', Jar)
    def zsRsrJar = project(':sakae:zs-rsr').tasks.named('jar', Jar)
    def ctiIfJavadoc = project(':cti-java:cti-if').tasks.named('javadoc')

    def prepareRelease = tasks.register('prepareRelease', Copy) {
        dependsOn ctiDriverFatJar, ctiDriverRestJar, ctiIfJavadoc
        into releaseDir

        from('README.txt') {
            filter(ReplaceTokens, tokens: [version: project.version.toString()], beginToken: '@', endToken: '@')
        }

        from('cti-examples/src/scripts') {
            filter(ReplaceTokens, tokens: [version: project.version.toString()], beginToken: '@', endToken: '@')
        }

        into('examples') {
            from('cti-examples/src/main') {
                include 'files/**'
                include 'webapp/**'
            }

            from('cti-examples/build.xml') {
                filter(ReplaceTokens, tokens: [version: project.version.toString()], beginToken: '@', endToken: '@')
                rename { 'build.xml' }
            }
        }

        into('examples/src') {
            from('cti-examples/src/main/java')
        }

        into('lib') {
            from(project(':cti-java:cti-driver').configurations.runtimeClasspath) {
                include '*servlet-api-*.jar'
            }
        }

        into('apidoc') {
            from ctiIfJavadoc
        }
    }

    def releaseDriverJar = tasks.register('releaseDriverJar', Jar) {
        dependsOn ctiDriverFatJar, ctiDriverRestJar
        archiveBaseName.set('cti-driver')
        archiveVersion.set(project.version.toString())
        destinationDirectory.set(releaseDir)
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        manifest {
            attributes('Main-Class': 'jp.cssj.driver.cli.Main')
        }

        from({
            zipTree(ctiDriverRestJar.get().archiveFile.get().asFile)
        }) {
            include 'META-INF/plugin/jp.cssj.cti2.CTIDriver.impl'
        }

        from({
            zipTree(ctiDriverFatJar.get().archiveFile.get().asFile)
        }) {
            exclude 'javax', 'javax/**', 'jakarta', 'jakarta/**'
            exclude 'META-INF/plugin/jp.cssj.cti2.CTIDriver.impl'
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        }
    }

    def releaseDriverMinJar = tasks.register('releaseDriverMinJar', Jar) {
        dependsOn ctiDriverCtipJar, ctiIfJar, zsPluginJar, zsResolverJar, zsRsrJar
        archiveBaseName.set('cti-driver-min')
        archiveVersion.set(project.version.toString())
        destinationDirectory.set(releaseDir)
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        from({ zipTree(ctiDriverCtipJar.get().archiveFile.get().asFile) }) {
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        }
        from({ zipTree(ctiIfJar.get().archiveFile.get().asFile) }) {
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        }
        from({ zipTree(zsPluginJar.get().archiveFile.get().asFile) }) {
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        }
        from({ zipTree(zsResolverJar.get().archiveFile.get().asFile) }) {
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        }
        from({ zipTree(zsRsrJar.get().archiveFile.get().asFile) }) {
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        }
    }

    def release = tasks.register('release') {
        dependsOn prepareRelease, releaseDriverJar, releaseDriverMinJar
    }

    def releaseZip = tasks.register('releaseZip', Zip) {
        dependsOn release
        archiveFileName.set("${archiveStem}.zip")
        destinationDirectory.set(layout.buildDirectory)
        from(releaseDir) {
            into archiveStem
        }
    }

    def releaseTar = tasks.register('releaseTar', Tar) {
        dependsOn release
        archiveFileName.set("${archiveStem}.tar")
        destinationDirectory.set(layout.buildDirectory)
        compression = Compression.NONE
        from(releaseDir) {
            into archiveStem
        }
    }

    def releaseTarGz = tasks.register('releaseTarGz', Tar) {
        dependsOn release
        archiveFileName.set("${archiveStem}.tar.gz")
        destinationDirectory.set(layout.buildDirectory)
        compression = Compression.GZIP
        from(releaseDir) {
            into archiveStem
        }
    }

    [release, releaseZip, releaseTar, releaseTarGz].each {
        it.configure {
            mustRunAfter tasks.named('clean')
        }
    }

    tasks.register('dist') {
        dependsOn tasks.named('clean'), releaseZip, releaseTar, releaseTarGz
    }
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '8.9'
    distributionType = Wrapper.DistributionType.BIN
}






