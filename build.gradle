def runtimeDependencyCopyProjectPaths = [
    ':cti-java:cti-ant',
    ':cti-java:cti-cli',
    ':cti-java:cti-driver',
    ':cti-java:cti-driver-ctip',
    ':cti-java:cti-driver-rest',
    ':cti-java:cti-examples',
    ':cti-java:cti-if',
    ':cti-java:cti-server-ctip',
    ':cti-java:cti-server-rest',
    ':homare',
    ':sakae:sakae-pdf'
] as Set

def native2AsciiProjectPaths = [
    ':cti-java:cti-if',
    ':cti-java:cti-server-rest',
    ':homare'
] as Set

allprojects {
    group = 'net.zamasoft'
    version = moduleVersions[project.name] ?: moduleVersions.copper

    repositories {
        mavenCentral()
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.force 'xml-apis:xml-apis:1.4.01'
    }
}

configure([rootProject, project(':cti-java'), project(':sakae')]) {
    apply plugin: 'base'
}

configure(subprojects.findAll { javaProjectPaths.contains(it.path) }) {
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.links('https://docs.oracle.com/javase/jp/8/docs/api/')
        options.addStringOption('Xdoclint:none', '-quiet')
        destinationDir = new File(System.getProperty('java.io.tmpdir'), 'copper-javadocs/' + project.path.replace(':', '_'))
        doFirst {
            destinationDir.mkdirs()
        }
    }

    tasks.named('processResources').configure {
        filteringCharset = 'UTF-8'
    }

    if (runtimeDependencyCopyProjectPaths.contains(path)) {
        def copyRuntimeDependencies = tasks.register('copyRuntimeDependencies', Sync) {
            from configurations.runtimeClasspath
            into layout.buildDirectory.dir('dependencies')
        }

        tasks.named('assemble').configure {
            dependsOn copyRuntimeDependencies
        }
    }

    if (native2AsciiProjectPaths.contains(path)) {
        tasks.named('processResources').configure {
            doLast {
                def outputDir = destinationDir
                if (outputDir == null || !outputDir.exists()) {
                    return
                }

                def propertyFiles = fileTree(outputDir) {
                    include '**/*.properties'
                }
                if (propertyFiles.isEmpty()) {
                    return
                }

                def tempDir = new File(temporaryDir, 'native2ascii')
                project.delete(tempDir)
                ant.native2ascii(src: outputDir, dest: tempDir, encoding: 'UTF-8', includes: '**/*.properties')
                copy {
                    from tempDir
                    into outputDir
                    include '**/*.properties'
                    includeEmptyDirs = false
                }
            }
        }
    }
}

